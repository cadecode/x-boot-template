# p6spy 配置，配合 application-dev.yml 中的
#   url: jdbc:p6spy:mysql://...
#   driver-class-name: com.p6spy.engine.spy.P6SpyDriver
# 使用。放在 datasource starter 中，业务应用无需重复配置。

# 拦截模块：慢 SQL 记录
# 若需把 SQL 日志接入 MyBatis 日志体系，可追加 com.baomidou.mybatisplus.extension.p6spy.MybatisPlusLogFactory
# （需要 mybatis-plus 在 classpath 上）
modulelist=com.p6spy.engine.outage.P6OutageFactory

# 日志格式：执行耗时 + 连接号 + 单行 SQL
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat===> P6Spy: %(executionTime) ms, connection%(connectionId), sql: %(sqlSingleLine)

# 走 SLF4J，交给应用日志框架
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 取消 JDBC URL 前缀
useprefix=true

# 驱动只由应用注册，p6spy 不再重复注册
deregisterdrivers=true

# 不打印 info/debug/result 等噪音
excludecategories=info,debug,result,commit,resultset

# 日期格式
dateformat=yyyy-MM-dd HH:mm:ss

# 慢 SQL：超过 2 秒记为慢 SQL
outagedetection=true
outagedetectioninterval=2
