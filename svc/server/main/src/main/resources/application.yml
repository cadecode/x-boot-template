server:
  shutdown: graceful
  port: 8080

# log
logging:
  file:
    path: /log/${spring.application.name}/

spring:
  profiles:
    active: @profileActive@
  application:
    # 应用名
    name: server-main
  lifecycle:
    timeout-per-shutdown-phase: 60s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    # druid 监控页与 Web 统计（连接池参数见 application-dev.yml 的 dynamic.druid）
    druid:
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username: dev
        login-password: dev123

# mybatis-plus
mybatis-plus:
  # XML mapper 位置
  mapper-locations: classpath*:mapper/mysql/**/*.xml
  type-aliases-package: com.github.cadecode.xboot.**.bean
  # mybatis 原生配置
  configuration:
    map-underscore-to-camel-case: true

# swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      packages-to-scan: com.github.cadecode.xboot
knife4j:
  enable: true
  setting:
    language: zh_cn

# 自定义配置
x-boot:
  framework:
    version: @project.version@
  swagger:
    title: API Docs
    description: ${spring.application.name} 接口文档
    version: ${x-boot.framework.version}
    contact-name: Cade Li
    contact-url: https://github.com/cadecode/x-boot-template
    contact-email: cade.li@qq.com
