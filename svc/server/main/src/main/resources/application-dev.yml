spring:
  datasource:
    dynamic:
      druid:
        socketTimeout: 60000
        initialSize: 5
        minIdle: 10
        maxActive: 20
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        maxEvictableIdleTimeMillis: 900000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        # 要启用的filters
        filters: stat
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
      primary: master
      strict: true
      # 启动时加载
      lazy: false
      datasource:
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          # jdbc:p6spy，配置见spy.properties
          url: jdbc:p6spy:mysql://127.0.0.1:3306/x_boot?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.p6spy.engine.spy.P6SpyDriver
          # 连接池配置，覆盖全局
          # druid:
          #   initialSize: 6
          #   minIdle: 100
          #   maxActive: 200
